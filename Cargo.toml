[package]
name = "pspp"
version = "0.1.0"
edition = "2021"
description = "ps++ — interactive memory usage grouped by parent process, btop-style"
license = "MIT"
# Newest MSRV among the locked dependencies (darling/instability via ratatui need 1.88).
rust-version = "1.88"
repository = "https://github.com/mtargosz/pspp"
readme = "README.md"
keywords = ["tui", "process", "memory", "monitor", "btop"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.33"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = true
strip = true
